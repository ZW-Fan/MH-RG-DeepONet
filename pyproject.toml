[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhrg-deeponet"
version = "0.1.0"
description = "MH-RG DeepONet for the NLSE collision benchmark"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Zhiwei Fan et al."}
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "torch>=2.1",
  "PyYAML>=6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
