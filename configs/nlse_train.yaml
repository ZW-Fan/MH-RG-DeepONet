experiment:
  name: nlse_collision
  output_dir: outputs
  checkpoint_root: checkpoints
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures

runtime:
  device: auto
  deterministic: true
  base_seed: 4321
  run_seeds: [4321, 5321, 6321]

model:
  hidden_width: 512
  latent_width: 256
  mh_rg_latent_width: 256
  out_dim: 2
  feat_dim: 6
  alpha_pre: 1.0
  alpha_b: 0.5
  alpha_t: 0.5
  rgate_mh: 8
  hidg_mh: 32
  preb_mh: 16
  mh_rg_heads: [6, 12, 18, 24]

training:
  epochs: 1500
  batch_size: 64
  points_per_sample: 64
  lr: 0.001
  grad_clip: 1.0
  force_retrain: false
  keep_models: false

nlse:
  nx: 128
  x_min: -10.0
  x_max: 10.0
  dt: 0.01
  t_max: 2.0

data:
  root: data
  u0_train: u0_train.npy
  sol_train: sol_train.npy
  u0_test: u0_test.npy
  sol_test: sol_test.npy
